# Kopiraj u /etc/supervisor/conf.d/ na produkcijskom serveru (bez Dockera).
# Prilagodi putanje i korisnika (www-data).

[program:admin-console-queue]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/admin-console/artisan queue:work database --sleep=3 --tries=3 --max-time=3600
directory=/var/www/admin-console
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/supervisor/admin-console-queue.log
stopwaitsecs=3600

[program:admin-console-scheduler]
process_name=%(program_name)s
command=/bin/bash -c "while [ true ]; do php /var/www/admin-console/artisan schedule:run --no-interaction; sleep 60; done"
directory=/var/www/admin-console
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/supervisor/admin-console-scheduler.log
