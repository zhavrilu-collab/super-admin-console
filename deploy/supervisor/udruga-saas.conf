# Kopiraj u /etc/supervisor/conf.d/ na produkcijskom serveru (bez Dockera).

[program:udruga-saas-queue]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/udruga-saas/artisan queue:work database --sleep=3 --tries=3 --max-time=3600
directory=/var/www/udruga-saas
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/supervisor/udruga-saas-queue.log
stopwaitsecs=3600

[program:udruga-saas-scheduler]
process_name=%(program_name)s
command=/bin/bash -c "while [ true ]; do php /var/www/udruga-saas/artisan schedule:run --no-interaction; sleep 60; done"
directory=/var/www/udruga-saas
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/supervisor/udruga-saas-scheduler.log
